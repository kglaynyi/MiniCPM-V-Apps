name: M-Print VoxCPM2 Android Debug APK
on:
  push:
    branches:
      - feature/voxcpm2-export-history-speed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK/NDK/CMake via preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"
      - name: Confirm isolated package and TTS export
        run: |
          grep -q 'com.kglaynyi.mprint.voxcpm' MiniCPM-V-demo-Android/app/build.gradle.kts
          grep -q 'btn_export_wav' MiniCPM-V-demo-Android/app/src/main/res/layout/activity_tts.xml
          git diff --check
      - name: Fix Apple-only F_NOCACHE in pinned llama.cpp submodule (Android build only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('llama.cpp-omni/src/llama-moe-slot.cpp')
          src = path.read_text()
          old1 = "    void apply_experts_nocache(bool on) {\n#ifndef _WIN32"
          new1 = "    void apply_experts_nocache(bool on) {\n#if defined(__APPLE__) && defined(F_NOCACHE)"
          old2 = """        const int fd = open(path.c_str(), O_RDONLY | O_CLOEXEC);
                  if (experts_nocache_desired() && fcntl(fd, F_NOCACHE, 1) != 0) {
                      moe_log("F_NOCACHE 设置失败: %s", std::strerror(errno));
                  }
          """.replace("                  ", "        ").replace("                      ", "            ")
          new2 = old2.replace("        if (experts_nocache_desired()", "#if defined(__APPLE__) && defined(F_NOCACHE)\n        if (experts_nocache_desired()") + "#endif\n"
          if src.count(old1) != 1 or src.count(old2) != 1:
              raise RuntimeError("Unexpected pinned submodule source; refusing blind modification")
          path.write_text(src.replace(old1, new1, 1).replace(old2, new2, 1))
          print("Android F_NOCACHE guards added")
          PY
      - name: Compile Debug APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:assembleDebug; then exit 0; fi
            echo "Gradle build attempt $attempt failed; retrying transient network errors"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprint-voxcpm2-android-debug
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
